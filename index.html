<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Integrity Room | Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <h1>The Integrity Room</h1>
    <div class="tagline">Every decision has a cost. What will you pay?</div>
    <div class="brand">Cre8Learn Institute &middot; Create. Learn. Innovate.</div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>⏱ Timer</h2>
      <div id="timerDisplay" class="timer-display">03:00</div>
      <div class="timer-controls">
        <input type="number" id="minutesInput" value="3" min="1" max="99">
        <button class="btn btn-primary" onclick="setTimer()">Set</button>
        <button class="btn btn-success" id="startBtn" onclick="startTimer()">Start</button>
        <button class="btn btn-warning" id="pauseBtn" onclick="pauseTimer()">Pause</button>
        <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
      </div>
      <div class="timer-controls timer-presets">
        <button class="btn btn-ghost btn-sm" onclick="quickTimer(1)">1 min</button>
        <button class="btn btn-ghost btn-sm" onclick="quickTimer(2)">2 min</button>
        <button class="btn btn-ghost btn-sm" onclick="quickTimer(3)">3 min</button>
        <button class="btn btn-ghost btn-sm" onclick="quickTimer(5)">5 min</button>
        <button class="btn btn-ghost btn-sm" onclick="quickTimer(10)">10 min</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Current Phase</h2>
      <div class="phase-display">
        <div class="label">Now Playing</div>
        <div class="value" id="phaseValue">Phase 1: Role Assignment</div>
      </div>
      <div class="phase-controls">
        <button class="btn btn-ghost btn-sm" onclick="setPhase(1)">Phase 1</button>
        <button class="btn btn-ghost btn-sm" onclick="setPhase(2)">Phase 2</button>
        <button class="btn btn-ghost btn-sm" onclick="setPhase(3)">Phase 3</button>
        <button class="btn btn-ghost btn-sm" onclick="setPhase(4)">Phase 4</button>
        <button class="btn btn-ghost btn-sm" onclick="setPhase(5)">Phase 5</button>
      </div>
      <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connected</span>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>🎯 Score Controls</h2>
      <div id="scoreControls"></div>
      <div class="action-row">
        <button class="btn btn-ghost btn-sm" onclick="resetScores()">Reset All Scores</button>
        <button class="btn btn-ghost btn-sm" onclick="loadTeams()">Refresh</button>
      </div>
    </div>

    <div class="card">
      <h2>🏆 Live Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>
  </div>

  <footer>
    <div class="brand">Cre8Learn Institute</div>
    <div>Create. Learn. Innovate.</div>
  </footer>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://kqzauqxyvqgncebyulds.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxemF1cXh5dnFnbmNlYnl1bGRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzM0NDUsImV4cCI6MjA5MTQwOTQ0NX0.SyGcJfsOYdkeo0K6szjU8OIv4Hb1g2CXzfD57Vo_PjU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let teams = [];
let timerInterval = null;
let timerSeconds = 180;
let timerRunning = false;
let leaderboardInterval = null;

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return m + ':' + sec;
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timerSeconds);
  el.classList.remove('warning', 'danger');
  if (timerSeconds <= 10) el.classList.add('danger');
  else if (timerSeconds <= 30) el.classList.add('warning');
}

function setTimer() {
  const mins = parseInt(document.getElementById('minutesInput').value) || 3;
  timerSeconds = mins * 60;
  updateTimerDisplay();
}

function quickTimer(mins) {
  document.getElementById('minutesInput').value = mins;
  setTimer();
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateTimerDisplay();
    } else {
      clearInterval(timerInterval);
      timerRunning = false;
      showToast('⏰ Time is up!');
      playBeep();
    }
  }, 1000);
  showToast('▶ Timer started');
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  showToast('⏸ Timer paused');
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  setTimer();
  showToast('↺ Timer reset');
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
    osc.start();
    osc.stop(ctx.currentTime + 1);
  } catch (e) {}
}

function setPhase(n) {
  const phases = {
    1: 'Phase 1: Role Assignment',
    2: 'Phase 2: The Dilemma Deck',
    3: 'Phase 3: Negotiation',
    4: 'Phase 4: The Blame Poll',
    5: 'Phase 5: Final Debrief'
  };
  document.getElementById('phaseValue').textContent = phases[n] || 'Phase ' + n;
  showToast('📋 ' + phases[n]);
}

async function loadTeams() {
  const { data, error } = await sb.from('game_teams').select('*').order('score', { ascending: false });
  if (error) {
    setStatus(false);
    return;
  }
  setStatus(true);
  teams = data || [];
  renderScoreControls();
  renderLeaderboard();
}

function setStatus(ok) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.classList.toggle('error', !ok);
  text.textContent = ok ? 'Connected' : 'Disconnected';
}

function renderScoreControls() {
  const container = document.getElementById('scoreControls');
  if (!teams.length) {
    container.innerHTML = '<p class="empty">No teams found.</p>';
    return;
  }
  container.innerHTML = teams.map(t => `
    <div class="team-row">
      <div class="team-name">${t.name}</div>
      <div class="score-btns">
        <button class="btn btn-danger" onclick="changeScore(${t.id}, -5)">-5</button>
        <button class="btn btn-ghost" onclick="changeScore(${t.id}, 3)">+3</button>
        <button class="btn btn-ghost" onclick="changeScore(${t.id}, 5)">+5</button>
        <button class="btn btn-success" onclick="changeScore(${t.id}, 10)">+10</button>
      </div>
      <div class="team-score">${t.score}</div>
    </div>
  `).join('');
}

function renderLeaderboard() {
  const container = document.getElementById('leaderboard');
  if (!teams.length) {
    container.innerHTML = '<p class="empty">No teams yet.</p>';
    return;
  }
  const sorted = [...teams].sort((a, b) => b.score - a.score);
  container.innerHTML = sorted.map((t, i) => {
    const medals = ['🥇', '🥈', '🥉'];
    const badge = medals[i] || ('#' + (i + 1));
    return `
      <div class="leaderboard-row rank-${i + 1}">
        <div class="rank-badge">${badge}</div>
        <div class="lb-name">${t.name}</div>
        <div class="lb-score">${t.score}</div>
      </div>
    `;
  }).join('');
}

async function changeScore(teamId, delta) {
  const team = teams.find(t => t.id === teamId);
  if (!team) return;
  const newScore = team.score + delta;
  const { error } = await sb.from('game_teams').update({ score: newScore, updated_at: new Date().toISOString() }).eq('id', teamId);
  if (error) { showToast('❌ Error updating score'); return; }
  await sb.from('game_scores').insert([{ team_id: teamId, delta: delta, reason: 'Manual update' }]);
  team.score = newScore;
  renderScoreControls();
  renderLeaderboard();
  showToast((delta > 0 ? '+' : '') + delta + ' → ' + team.name);
}

async function resetScores() {
  if (!confirm('Reset all scores to 0?')) return;
  for (const t of teams) {
    await sb.from('game_teams').update({ score: 0 }).eq('id', t.id);
  }
  showToast('↺ All scores reset');
  loadTeams();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

updateTimerDisplay();
loadTeams();
leaderboardInterval = setInterval(loadTeams, 3000);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); timerRunning ? pauseTimer() : startTimer(); }
  if (e.key === 'r' || e.key === 'R') resetTimer();
});
</script>
</body>
</html>
